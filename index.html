<title>سباق عبدالعزيز</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap">
<style>
/* Layout: full-screen top-down highway on a canvas; HUD floats at the top, big thumb buttons at the bottom, menus are panels over the moving road */
:root{
  --asphalt:#2a2e35;
  --sand:#ecc98b;
  --sun:#ffb81c;
  --sun-deep:#c96a12;
  --brake:#ef3e36;
  --night:#14213d;
  --chalk:#fffaf0;
  --panel:rgba(20,33,61,.9);
  --glass:rgba(20,33,61,.6);
  --line:rgba(255,250,240,.22);
  --display:'Lalezar','Baloo Bhaijaan 2',system-ui,sans-serif;
  --body:'Baloo Bhaijaan 2',system-ui,'Segoe UI',Tahoma,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--asphalt);color:var(--chalk);font-family:var(--body);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#app{position:fixed;inset:0;overflow:hidden}
#road{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

/* HUD */
.hud{position:absolute;top:0;left:0;right:0;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.hud-col{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.hud-col.end{align-items:flex-end}
.pill{display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-size:1rem;line-height:1.3;font-variant-numeric:tabular-nums;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.pill .lbl{font-weight:500;font-size:.8rem;opacity:.8}
.pill.big b{font-size:1.45rem;font-family:var(--display);font-weight:400;letter-spacing:.02em}
.hearts{color:var(--brake);font-size:1.15rem;letter-spacing:2px}
.hearts .off{color:rgba(255,250,240,.25)}
.coin-ico{display:inline-block;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0 0 18%,var(--sun) 40%,var(--sun-deep) 100%);box-shadow:inset 0 0 0 2px rgba(150,80,10,.6);flex:none}
.speedo{flex-direction:column;gap:0;border-radius:16px;padding:4px 12px 6px;align-items:center}
.speedo b{font-family:var(--display);font-weight:400;font-size:1.6rem;line-height:1}
.speedo span{font-size:.7rem;opacity:.8;font-weight:700}
.icon-btn{pointer-events:auto;width:46px;height:46px;border-radius:14px;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px;fill:var(--chalk)}

/* Bottom controls */
.controls{position:absolute;left:0;right:0;bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-end;gap:10px;direction:ltr;pointer-events:none}
.controls button{pointer-events:auto}
.arrow{width:78px;height:78px;border-radius:50%;background:var(--glass);border:3px solid rgba(255,250,240,.55);display:grid;place-items:center;transition:transform .08s}
.arrow svg{width:34px;height:34px;fill:var(--chalk)}
.arrow:active,.arrow.pressed{transform:scale(.92);background:rgba(255,184,28,.45)}
.mid{display:flex;gap:10px;align-items:flex-end}
.nitro{height:66px;min-width:96px;padding:0 16px;border-radius:20px;background:linear-gradient(180deg,#3fb6ff,#1565c0);border:3px solid #bfe6ff;font-family:var(--display);font-size:1.35rem;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;box-shadow:0 5px 0 #0b3d78}
.nitro:active{transform:translateY(3px);box-shadow:0 2px 0 #0b3d78}
.nitro.empty{filter:grayscale(1);opacity:.55}
.nitro.on{animation:pulse .3s infinite alternate}
@keyframes pulse{to{box-shadow:0 5px 0 #0b3d78,0 0 24px #3fb6ff}}
.pips{display:flex;gap:4px;direction:ltr}
.pips i{width:12px;height:6px;border-radius:3px;background:rgba(255,255,255,.3)}
.pips i.full{background:#fff}
.horn{width:58px;height:58px;border-radius:50%;background:var(--glass);border:2px solid var(--line);font-weight:800;font-size:.85rem}
.horn:active{background:rgba(255,184,28,.45)}

/* Screens */
.screen{position:absolute;inset:0;display:flex;overflow-y:auto;padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,rgba(20,33,61,.25),rgba(20,33,61,.7))}
.panel{margin:auto;width:100%;max-width:420px;background:var(--panel);border:2px solid rgba(255,184,28,.4);border-radius:24px;padding:18px 18px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.top-row{display:flex;justify-content:space-between;align-items:center}
.wallet{display:flex;align-items:center;gap:6px;font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums;background:rgba(255,184,28,.14);border-radius:999px;padding:4px 14px}
.title{font-family:var(--display);font-weight:400;color:var(--sun);font-size:clamp(2.7rem,13vw,3.7rem);line-height:1.05;margin:0;text-align:center;text-shadow:0 4px 0 var(--sun-deep),0 10px 20px rgba(0,0,0,.45);text-wrap:balance}
.title.sm{font-size:clamp(2.1rem,10vw,2.8rem)}
.plate{align-self:center;display:flex;direction:ltr;background:#fdfdfb;color:#111;border:3px solid #111;border-radius:8px;overflow:hidden;font-weight:800;line-height:1}
.plate .ksa{background:#1f6f43;color:#fff;font-size:.65rem;writing-mode:vertical-rl;padding:4px 3px;letter-spacing:.1em;display:flex;align-items:center;justify-content:center}
.plate .rows{display:flex;flex-direction:column}
.plate .rows span{padding:3px 14px;font-size:1.05rem;text-align:center;letter-spacing:.12em}
.plate .rows span+span{border-top:2px solid #111;font-family:system-ui,sans-serif;font-size:.95rem}
#preview{width:100%;height:132px;display:block}
.sect{display:flex;flex-direction:column;gap:8px}
.sect-h{font-weight:800;font-size:.85rem;letter-spacing:.04em;opacity:.75}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{border-radius:14px;border:2px solid var(--line);padding:8px 4px;font-weight:800;font-size:1rem;display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,255,255,.04)}
.chip.sel{border-color:var(--sun);background:rgba(255,184,28,.18)}
.price{display:flex;align-items:center;gap:4px;font-size:.78rem;font-weight:700;opacity:.9;font-variant-numeric:tabular-nums}
.price .coin-ico{width:12px;height:12px}
.price.owned{opacity:.55}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 8px}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px}
.sw .dot{width:42px;height:42px;border-radius:50%;border:3px solid rgba(255,255,255,.25);position:relative}
.sw.sel .dot{border-color:var(--sun);box-shadow:0 0 0 3px rgba(255,184,28,.35)}
.sw.locked .dot::after{content:"";position:absolute;inset:-3px;border-radius:50%;background:rgba(10,15,30,.45)}
.go{height:64px;border-radius:20px;background:linear-gradient(180deg,#ffcf4a,var(--sun));color:#3a1d00;font-family:var(--display);font-size:1.9rem;box-shadow:0 6px 0 var(--sun-deep);transition:transform .08s}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sun-deep)}
.ghost{height:52px;border-radius:16px;border:2px solid var(--line);font-weight:800;font-size:1.1rem}
.best{margin:0;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.best b{color:var(--sun)}
.how{margin:0;text-align:center;font-size:.92rem;line-height:1.7;opacity:.85}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:rgba(255,255,255,.06);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.stats span{font-size:.8rem;opacity:.8;font-weight:700}
.stats b{font-family:var(--display);font-weight:400;font-size:1.5rem;font-variant-numeric:tabular-nums}
.new-rec{align-self:center;background:var(--brake);color:#fff;font-weight:800;border-radius:999px;padding:4px 16px;animation:pulse2 .6s infinite alternate}
@keyframes pulse2{to{transform:scale(1.08)}}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 18px);transform:translateX(-50%);background:var(--night);border:2px solid var(--sun);border-radius:14px;padding:8px 16px;font-weight:800;max-width:calc(100% - 32px);text-align:center;z-index:5}
@media (prefers-reduced-motion:reduce){.new-rec,.nitro.on{animation:none}}
</style>

<div id="app" dir="rtl">
  <canvas id="road"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="hud-col">
      <div class="pill big"><span class="lbl">المسافة</span><b id="hDist">0</b><span class="lbl">م</span></div>
      <div class="pill"><span class="coin-ico"></span><b id="hCoins">0</b></div>
      <div class="pill hearts" id="hHearts" aria-label="القلوب"></div>
    </div>
    <div class="hud-col end">
      <button class="icon-btn" id="bPause" aria-label="إيقاف مؤقت"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
      <div class="pill speedo"><b id="hSpeed">0</b><span>كم/س</span></div>
    </div>
  </div>

  <div class="controls" id="controls" hidden>
    <button class="arrow" id="bLeft" aria-label="يسار"><svg viewBox="0 0 24 24"><path d="M15.5 4 7 12l8.5 8 2-2-6.4-6 6.4-6z"/></svg></button>
    <div class="mid">
      <button class="horn" id="bHorn">بوري</button>
      <button class="nitro" id="bNitro">نيترو<span class="pips" id="nPips"></span></button>
    </div>
    <button class="arrow" id="bRight" aria-label="يمين"><svg viewBox="0 0 24 24"><path d="M8.5 4 17 12l-8.5 8-2-2 6.4-6-6.4-6z"/></svg></button>
  </div>

  <div class="screen" id="menu">
    <div class="panel">
      <div class="top-row">
        <div class="wallet"><span class="coin-ico"></span><b id="mCoins">0</b></div>
        <button class="icon-btn" id="bSound" aria-label="الصوت"></button>
      </div>
      <h1 class="title">سباق عبدالعزيز</h1>
      <div class="plate" aria-hidden="true"><span class="ksa">KSA</span><span class="rows"><span>عزوز ٩</span><span>AZOZ 9</span></span></div>
      <canvas id="preview"></canvas>
      <div class="sect"><div class="sect-h">شكل الكابرس</div><div class="chips" id="styles"></div></div>
      <div class="sect"><div class="sect-h">اللون</div><div class="swatches" id="swatches"></div></div>
      <button class="go" id="bStart">يلا نسوق!</button>
      <p class="best">أفضل مسافة: <b id="mBest">0</b> م</p>
      <p class="how">اضغط يمين أو يسار الشاشة عشان تغيّر المسار. اجمع الفلوس، خذ علب النيترو، ولا تصدم السيارات!</p>
    </div>
  </div>

  <div class="screen" id="pause" hidden>
    <div class="panel">
      <h2 class="title sm">استراحة</h2>
      <button class="go" id="bResume">كمّل</button>
      <button class="ghost" id="bQuit">القائمة الرئيسية</button>
    </div>
  </div>

  <div class="screen" id="over" hidden>
    <div class="panel">
      <h2 class="title sm">انتهت الجولة!</h2>
      <div class="new-rec" id="oRec" hidden>رقم قياسي جديد!</div>
      <div class="stats">
        <div><span>المسافة</span><b id="oDist">0</b></div>
        <div><span>الفلوس</span><b id="oCoins">0</b></div>
        <div><span>الأفضل</span><b id="oBest">0</b></div>
      </div>
      <button class="go" id="bAgain">مرة ثانية</button>
      <button class="ghost" id="bGarage">الكراج</button>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const cv = $('#road'), ctx = cv.getContext('2d');
const pv = $('#preview'), pctx = pv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const G = { lanes: 3, roadW: 0, roadX: 0, laneW: 0, carW: 0, carH: 0, ppm: 25 };
const laneX = l => G.roadX + G.laneW * (l + .5);
const rand = (a, b) => a + Math.random() * (b - a);
const fmt = n => Math.floor(n).toLocaleString('en');

/* ---------- Save data ---------- */
const SAVE_KEY = 'azoz-caprice-race-v1';
let save = { best: 0, coins: 0, colors: ['white', 'black', 'red'], styles: ['classic'], color: 'white', style: 'classic' };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && typeof s === 'object') save = Object.assign(save, s); } catch (e) {}
let muted = false;
try { muted = localStorage.getItem(SAVE_KEY + '-mute') === '1'; } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

const COLORS = [
  { id: 'white', name: 'أبيض', hex: '#f1f1ec', price: 0 },
  { id: 'black', name: 'أسود', hex: '#1c1e23', price: 0 },
  { id: 'red', name: 'أحمر', hex: '#c41f2a', price: 0 },
  { id: 'silver', name: 'فضي', hex: '#a7afb8', price: 30 },
  { id: 'blue', name: 'أزرق', hex: '#1f5fbf', price: 40 },
  { id: 'green', name: 'أخضر', hex: '#1d8a4b', price: 60 },
  { id: 'purple', name: 'بنفسجي', hex: '#6b3fa0', price: 100 },
  { id: 'gold', name: 'ذهبي', hex: '#d4a62a', price: 150 },
];
const STYLES = [
  { id: 'classic', name: 'كلاسيك', price: 0 },
  { id: 'sport', name: 'سبورت', price: 80 },
  { id: 'police', name: 'شرطة', price: 200 },
];
const colorHex = () => (COLORS.find(c => c.id === save.color) || COLORS[0]).hex;

/* ---------- Audio ---------- */
let ac = null, master = null, engOsc = null, engGain = null;
function audioInit() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = muted ? 0 : .5; master.connect(ac.destination);
    engOsc = ac.createOscillator(); engOsc.type = 'sawtooth'; engOsc.frequency.value = 50;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 380;
    engGain = ac.createGain(); engGain.gain.value = 0;
    engOsc.connect(f); f.connect(engGain); engGain.connect(master); engOsc.start();
  } catch (e) { ac = null; }
}
function tone(freq, dur, type = 'square', vol = .15, slideTo = 0, delay = 0) {
  if (!ac) return;
  const t0 = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + .02);
}
function noise(dur, vol = .4, cutoff = 900) {
  if (!ac) return;
  const len = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'lowpass'; f.frequency.value = cutoff; g.gain.value = vol;
  s.buffer = buf; s.connect(f); f.connect(g); g.connect(master); s.start();
}
const sfx = {
  coin() { tone(988, .07, 'square', .1); tone(1319, .14, 'square', .1, 0, .06); },
  lane() { tone(220, .06, 'triangle', .06, 300); },
  crash() { noise(.6, .7, 700); tone(120, .4, 'sawtooth', .2, 40); },
  bump() { noise(.25, .5, 1400); tone(300, .15, 'square', .1, 120); },
  nitro() { noise(.9, .35, 2500); tone(200, .8, 'sawtooth', .12, 900); },
  pickup() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .1, 'square', .1, 0, i * .06)); },
  horn() { tone(392, .5, 'square', .09); tone(494, .5, 'square', .09); },
  click() { tone(660, .05, 'square', .08); },
};

/* ---------- World state ---------- */
let state = 'menu';            // menu | play | pause | over
let t = 0, scroll = 0, speed = 90, runTime = 0, dist = 0, bonus = 0, runCoins = 0;
let hearts = 3, nitroCharges = 1, nitroT = 0, shake = 0, rowAcc = 0, pickAccM = 0, nitroAccM = 0, heartAccM = 0, decorAcc = 0, nextSign = 500;
const player = { lane: 1, x: 0, y: 0, tilt: 0, inv: 0 };
let traffic = [], pickups = [], decor = [], parts = [], floats = [], streaks = [];
const speckles = Array.from({ length: 80 }, () => [Math.random(), Math.random(), Math.random()]);
const TRAFFIC_KMH = 85;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  G.roadW = Math.min(W * .8, 440); G.roadX = (W - G.roadW) / 2; G.laneW = G.roadW / G.lanes;
  G.carW = G.laneW * .56; G.carH = G.carW * 2.15; G.ppm = G.carH / 5.3;
  player.y = H * .72;
  if (!player.x) player.x = laneX(player.lane);
}

/* ---------- Drawing helpers ---------- */
function rr(c, x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function trap(c, y1, w1, y2, w2) { c.beginPath(); c.moveTo(-w1 / 2, y1); c.lineTo(w1 / 2, y1); c.lineTo(w2 / 2, y2); c.lineTo(-w2 / 2, y2); c.closePath(); }
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const f = amt < 0 ? 0 : 255, p = Math.abs(amt);
  r = Math.round((f - r) * p + r); g = Math.round((f - g) * p + g); b = Math.round((f - b) * p + b);
  return `rgb(${r},${g},${b})`;
}
function isLight(hex) { const n = parseInt(hex.slice(1), 16); return ((n >> 16) * .3 + (n >> 8 & 255) * .59 + (n & 255) * .11) > 150; }
function tires(c, w, h, ys) {
  c.fillStyle = '#0c0c0e';
  const tw = w * .15, th = h * .14;
  for (const s of [-1, 1]) for (const y of ys) { rr(c, s * w / 2 - tw / 2 + s * tw * .05, y - th / 2, tw, th, tw * .3); c.fill(); }
}

/* The Caprice: long boxy sedan, quad headlights, chrome bumpers, formal roofline. Faces up. */
function drawCaprice(c, x, y, w, h, base, style, opts = {}) {
  c.save(); c.translate(x, y); if (opts.rot) c.rotate(opts.rot);
  if (opts.alpha != null) c.globalAlpha = opts.alpha;
  if (opts.nitro) {
    for (const s of [-1, 1]) {
      const fl = h * (.28 + .12 * Math.sin(t * 50 + s));
      const g = c.createLinearGradient(0, h / 2, 0, h / 2 + fl);
      g.addColorStop(0, '#ffffff'); g.addColorStop(.25, '#7fd4ff'); g.addColorStop(.6, '#ff9f1c'); g.addColorStop(1, 'rgba(255,80,20,0)');
      c.fillStyle = g; c.beginPath(); c.moveTo(s * w * .22 - w * .1, h / 2 - 2); c.lineTo(s * w * .22 + w * .1, h / 2 - 2); c.lineTo(s * w * .22, h / 2 + fl); c.closePath(); c.fill();
    }
  }
  c.fillStyle = 'rgba(0,0,0,.3)'; rr(c, -w / 2 + w * .07, -h / 2 + h * .04, w, h, w * .18); c.fill();
  tires(c, w, h, [-h * .3, h * .27]);
  const g = c.createLinearGradient(-w / 2, 0, w / 2, 0);
  g.addColorStop(0, shade(base, -.38)); g.addColorStop(.16, base); g.addColorStop(.5, shade(base, .14)); g.addColorStop(.84, base); g.addColorStop(1, shade(base, -.38));
  c.fillStyle = g; rr(c, -w / 2, -h / 2, w, h, w * .14); c.fill();

  // glass

  c.fillStyle = gl; trap(c, -h * .23, w * .84, -h * .065, w * .72); c.fill();
  c.fillStyle = '#17212d';
  for (const s of [-1, 1]) c.fillRect(s > 0 ? w * .36 : -w * .42, -h * .06, w * .06, h * .235);
  c.fillStyle = '#22303f'; trap(c, h * .175, w * .72, h * .27, w * .82); c.fill();
  // roof (classic gets the darker landau top)

  rr(c, -w * .36, -h * .07, w * .72, h * .25, w * .07); c.fill();
  if (style === 'police') { c.fillStyle = shade(base, .05); rr(c, -w * .36, -h * .07, w * .72, h * .25, w * .07); c.fill(); }
  if (style === 'sport') {

    c.fillStyle = '#15171c'; c.fillRect(-w * .44, h / 2 - h * .075, w * .88, h * .03); // spoiler
  }

  // front: chrome bumper, grille, quad lights

  c.fillStyle = '#2a2d33'; c.fillRect(-w * .19, -h / 2 + h * .022, w * .38, h * .028);
  c.fillStyle = '#c8ccd2'; c.fillRect(-w * .03, -h / 2 + h * .022, w * .06, h * .028);
  c.fillStyle = '#fff6cf';

function drawTraffic(car) {

    c.fillStyle = '#fff6cf'; for (const s of [-1, 1]) c.fillRect(s * w * .3 - w * .08, -h / 2 + h * .02, w * .16, h * .03);
    c.fillStyle = '#c8131e'; for (const s of [-1, 1]) c.fillRect(s * w * .3 - w * .09, h / 2 - h * .045, w * .18, h * .03);

function drawPickup(p) {
  const x = laneX(p.lane), y = p.y, r = G.laneW * .14, c = ctx;
  c.save(); c.translate(x, y);
  if (p.type === 'coin') {
    const sx = Math.max(.15, Math.abs(Math.cos(t * 4 + p.seed)));
    c.scale(sx, 1);
    c.fillStyle = 'rgba(0,0,0,.2)'; c.beginPath(); c.arc(3, 4, r, 0, 7); c.fill();
    const g = c.createRadialGradient(-r * .3, -r * .3, 1, 0, 0, r);
    g.addColorStop(0, '#fff3b0'); g.addColorStop(.5, '#ffb81c'); g.addColorStop(1, '#c96a12');
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill();
    c.strokeStyle = 'rgba(150,80,10,.7)'; c.lineWidth = 2; c.beginPath(); c.arc(0, 0, r * .68, 0, 7); c.stroke();
  } else if (p.type === 'nitro') {
    const bob = Math.sin(t * 5 + p.seed) * 3; c.translate(0, bob);

    c.fillStyle = '#fff'; c.font = `800 ${r * 1.2}px ${getComputedStyle(document.body).fontFamily}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('N', 0, r * .1);
  } else {
    const s = r * (1 + .1 * Math.sin(t * 6)); c.fillStyle = '#ef3e36'; c.shadowBlur = 12; c.shadowColor = '#ff8080';
    c.beginPath(); c.moveTo(0, s * .9); c.bezierCurveTo(-s * 1.6, -s * .1, -s * .7, -s * 1.3, 0, -s * .45); c.bezierCurveTo(s * .7, -s * 1.3, s * 1.6, -s * .1, 0, s * .9); c.fill();

function drawDecor(d) {
  const c = ctx, s = G.laneW;
  const x = d.side < 0 ? G.roadX - d.off * s : G.roadX + G.roadW + d.off * s;
  c.save(); c.translate(x, d.y);
  if (d.kind === 'palm') {
    const R = s * .42 * d.scale;
    c.fillStyle = 'rgba(80,50,10,.22)'; c.beginPath(); c.ellipse(R * .35, R * .4, R, R * .85, 0, 0, 7); c.fill();
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * Math.PI * 2 + d.rot;
      c.save(); c.rotate(a); c.fillStyle = i % 2 ? '#2f8a45' : '#226b35';
      c.beginPath(); c.ellipse(R * .5, 0, R * .55, R * .16, 0, 0, 7); c.fill(); c.restore();
    }
    c.fillStyle = '#7a5226'; c.beginPath(); c.arc(0, 0, R * .16, 0, 7); c.fill();
  } else if (d.kind === 'bush') {
    const R = s * .16 * d.scale; c.fillStyle = '#a3a64f';
    for (const [dx, dy, k] of [[0, 0, 1], [R * .8, R * .3, .8], [-R * .7, R * .4, .75], [R * .1, -R * .7, .7]]) { c.beginPath(); c.arc(dx, dy, R * k, 0, 7); c.fill(); }
  } else if (d.kind === 'rock') {
    c.fillStyle = '#b89a6a'; c.beginPath(); c.ellipse(0, 0, s * .12 * d.scale, s * .08 * d.scale, d.rot, 0, 7); c.fill();
  } else if (d.kind === 'lamp') {
    const arm = s * .32;
    c.strokeStyle = '#5d636c'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, 0); c.lineTo(-d.side * arm, 0); c.stroke();
    c.fillStyle = '#4a4f57'; c.beginPath(); c.arc(0, 0, 5, 0, 7); c.fill();
    c.fillStyle = '#e8eaee'; rr(c, -d.side * arm - 7, -4, 14, 8, 3); c.fill();
  } else if (d.kind === 'sign') {
    const bw = s * .95, bh = s * .48;
    c.fillStyle = '#5d636c'; c.fillRect(-bw * .3, bh * .45, 4, bh * .4); c.fillRect(bw * .3 - 4, bh * .45, 4, bh * .4);
    c.fillStyle = '#1f6f43'; rr(c, -bw / 2, -bh / 2, bw, bh, 6); c.fill();
    c.strokeStyle = '#fff'; c.lineWidth = 2; rr(c, -bw / 2 + 3, -bh / 2 + 3, bw - 6, bh - 6, 4); c.stroke();
    c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = `800 ${bh * .42}px 'Baloo Bhaijaan 2', system-ui, sans-serif`; c.fillText(d.text, 0, 1);
  }
  c.restore();
}

function spawnDecor(y) {
  for (const side of [-1, 1]) {
    const space = side < 0 ? G.roadX : W - G.roadX - G.roadW;
    if (space < 20) continue;
    const r = Math.random();
    if (r < .22) decor.push({ side, y: y + rand(-30, 30), kind: 'lamp', off: .09 });
    const maxOff = Math.max(.4, space / G.laneW - .3);
    if (Math.random() < .55) decor.push({ side, y: y + rand(-60, 60), kind: Math.random() < .5 ? 'palm' : (Math.random() < .6 ? 'bush' : 'rock'), off: rand(.45, maxOff), scale: rand(.8, 1.25), rot: rand(0, 6) });
  }
}

/* ---------- Spawning ---------- */
const TRAFFIC_COLORS = ['#d9d9d6', '#3c6e9f', '#8c2f39', '#2d2f35', '#e8e4d8', '#6d7f3a', '#b5651d', '#5a6b7c', '#f2f2ee'];
function spawnRow() {
  const p2 = Math.min(.5, .12 + runTime * .004);
  const n = Math.random() < p2 ? 2 : 1;
  const lanes = [0, 1, 2].sort(() => Math.random() - .5).slice(0, n);
  for (const lane of lanes) {
    const r = Math.random();
    const k = r < .5 ? 'sedan' : r < .75 ? 'suv' : r < .87 ? 'taxi' : 'truck';
    let ws = .94, hs = .8, color = TRAFFIC_COLORS[Math.random() * TRAFFIC_COLORS.length | 0];
    if (k === 'suv') { ws = .98; hs = .86; }
    if (k === 'taxi') color = '#f1f1ec';
    if (k === 'truck') { ws = 1.06; hs = 1.42; color = ['#c0392b', '#2471a3', '#f1f1ec'][Math.random() * 3 | 0]; }
    traffic.push({ lane, ws, hs, k, color, y: -hs * G.carH, hit: false });
  }
}
function spawnPickups(dM) {
  pickAccM += dM; nitroAccM += dM; heartAccM += dM;
  if (pickAccM >= 26) {
    pickAccM = 0;
    if (Math.random() < .6) {
      const lane = Math.random() * 3 | 0, n = 4 + (Math.random() * 3 | 0);
      for (let i = 0; i < n; i++) pickups.push({ type: 'coin', lane, y: -30 - i * G.carH * .42, seed: i * .5 });
    }
  }
  if (nitroAccM >= 320) { nitroAccM = 0; pickups.push({ type: 'nitro', lane: Math.random() * 3 | 0, y: -60, seed: Math.random() * 6 }); }
  if (heartAccM >= 900) { heartAccM = 0; if (hearts < 3) pickups.push({ type: 'heart', lane: Math.random() * 3 | 0, y: -60, seed: 0 }); }
}

function burst(x, y, colors, n = 18, sp = 260) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = rand(.3, 1) * sp;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(.4, .9), max: .9, color: colors[i % colors.length], size: rand(3, 7) });
  }
}
function floatText(x, y, text, color = '#fff') { floats.push({ x, y, text, color, life: 1 }); }

/* ---------- Game flow ---------- */
function show(id, on) { $(id).hidden = !on; }
function startRun() {
  audioInit();
  traffic = []; pickups = []; parts = []; floats = [];
  runTime = 0; dist = 0; bonus = 0; runCoins = 0; hearts = 3; nitroCharges = 1; nitroT = 0; shake = 0;
  rowAcc = -G.carH * 1.5; pickAccM = 10; nitroAccM = 0; heartAccM = 0; nextSign = 500;
  player.lane = 1; player.inv = 0; speed = Math.max(speed, 100);
  state = 'play';
  show('#menu', false); show('#over', false); show('#pause', false); show('#hud', true); show('#controls', true);
  renderHud(true);
}
function endRun() {
  state = 'over';
  const total = Math.floor(dist + bonus);
  const rec = total > save.best;
  if (rec) save.best = total;
  save.coins += runCoins; persist();
  $('#oDist').textContent = fmt(total); $('#oCoins').textContent = '+' + runCoins; $('#oBest').textContent = fmt(save.best);
  $('#oRec').hidden = !rec;
  show('#controls', false);
  setTimeout(() => { if (state === 'over') { show('#hud', false); show('#over', true); if (rec) [0, .15, .3, .45].forEach((d, i) => tone([523, 659, 784, 1047][i], .25, 'square', .1, 0, d)); } }, 900);
}
function goMenu() {
  state = 'menu'; traffic = []; pickups = [];
  show('#hud', false); show('#controls', false); show('#pause', false); show('#over', false); show('#menu', true);
  buildGarage();
}
function setPause(on) {
  if (on && state === 'play') { state = 'pause'; show('#pause', true); }
  else if (!on && state === 'pause') { state = 'play'; show('#pause', false); }
}
function steer(dir) {
  if (state !== 'play') return;
  const nl = Math.max(0, Math.min(2, player.lane + dir));
  if (nl !== player.lane) { player.lane = nl; sfx.lane(); }
}
function useNitro() {
  if (state !== 'play' || nitroT > 0 || nitroCharges <= 0) return;
  nitroCharges--; nitroT = 3.2; shake = 6; sfx.nitro(); renderHud(true);
}

/* ---------- Update ---------- */
function update(dt) {
  t += dt;
  if (state === 'pause') return;
  const playing = state === 'play';
  if (playing) runTime += dt;
  const target = state === 'over' ? 0 : playing ? Math.min(190, 120 + runTime * 1.1) + (nitroT > 0 ? 75 : 0) : 95;
  speed += (target - speed) * Math.min(1, dt * (state === 'over' ? 3 : 2.2));
  const spx = speed / 3.6 * G.ppm;
  scroll += spx * dt;
  const dM = speed / 3.6 * dt;
  if (playing) { dist += dM; spawnPickups(dM); }
  if (nitroT > 0) { nitroT -= dt; if (Math.random() < dt * 40) streaks.push({ x: rand(0, W), y: -40, len: rand(40, 110) }); }
  player.inv = Math.max(0, player.inv - dt);
  shake = Math.max(0, shake - dt * 30);

  const tx = laneX(player.lane);
  player.x += (tx - player.x) * Math.min(1, dt * 14);
  player.tilt = Math.max(-.3, Math.min(.3, (tx - player.x) / G.laneW * .45));

  // decor
  decorAcc += spx * dt;
  if (decorAcc > G.carH * .8) { decorAcc = 0; spawnDecor(-G.laneW); }
  if (playing && dist >= nextSign) {
    decor.push({ side: 1, y: -G.laneW, kind: 'sign', off: .62, text: nextSign % 1000 === 0 ? `${nextSign / 1000} كم` : `${nextSign} م` });
    nextSign += 500;
  }
  for (const d of decor) d.y += spx * dt;
  decor = decor.filter(d => d.y < H + G.laneW * 1.2);

  // traffic
  const rel = Math.max(0, (speed - TRAFFIC_KMH) / 3.6 * G.ppm);
  if (playing) {
    rowAcc += rel * dt;
    const gap = Math.max(G.carH * 2.4, rel * Math.max(.78, 1.2 - runTime * .004));
    if (rowAcc >= gap) { rowAcc = 0; spawnRow(); }
  }
  const pw = G.carW, ph = G.carH;
  for (const car of traffic) {
    if (car.hit) {
      car.fx += car.vx * dt; car.y += (rel + car.vy) * dt; car.rot += car.spin * dt; car.alpha -= dt * 1.1;
      continue;
    }
    car.y += (state === 'over' ? spx - TRAFFIC_KMH / 3.6 * G.ppm : rel) * dt;
    if (!playing) continue;
    const cw = car.ws * G.carW, ch = car.hs * G.carH, cx = laneX(car.lane);
    if (Math.abs(cx - player.x) < (pw + cw) / 2 * .8 && Math.abs(car.y - player.y) < (ph + ch) / 2 * .86) {
      car.hit = true; car.fx = cx; car.alpha = 1; car.rot = 0;
      const dir = Math.sign(cx - player.x) || (Math.random() < .5 ? -1 : 1);
      car.vx = dir * rand(350, 600); car.vy = -rand(100, 300); car.spin = dir * rand(4, 9);
      const mx = (cx + player.x) / 2, my = (car.y + player.y) / 2;
      if (nitroT > 0) {
        bonus += 50; burst(mx, my, ['#fff', '#7fd4ff', '#ffb81c'], 16); floatText(mx, my, '+50', '#7fd4ff'); sfx.bump(); shake = 8;
      } else if (player.inv <= 0) {
        hearts--; player.inv = 1.6; shake = 16; burst(mx, my, ['#ffb81c', '#ef3e36', '#555', '#fff'], 26, 320); sfx.crash();
        if (navigator.vibrate) try { navigator.vibrate(120); } catch (e) {}
        renderHud(true);
        if (hearts <= 0) { burst(player.x, player.y, ['#ff6b1c', '#ffb81c', '#333'], 40, 380); endRun(); }
      }
    }
  }
  traffic = traffic.filter(c => c.y < H + G.carH * 2 && !(c.hit && c.alpha <= 0));

  // pickups
  for (const p of pickups) {
    p.y += spx * dt;
    if (!playing || p.taken) continue;
    if (Math.abs(laneX(p.lane) - player.x) < G.laneW * .45 && Math.abs(p.y - player.y) < G.carH * .55) {
      p.taken = true;
      const x = laneX(p.lane);
      if (p.type === 'coin') { runCoins++; sfx.coin(); burst(x, p.y, ['#ffe27a', '#ffb81c'], 6, 120); }
      else if (p.type === 'nitro') { nitroCharges = Math.min(3, nitroCharges + 1); sfx.pickup(); floatText(x, p.y, 'نيترو!', '#7fd4ff'); }
      else { hearts = Math.min(3, hearts + 1); sfx.pickup(); floatText(x, p.y, 'قلب!', '#ff8080'); }
      renderHud(true);
    }
  }
  pickups = pickups.filter(p => !p.taken && p.y < H + 60);

  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt + spx * dt * .3; p.vx *= .96; p.vy *= .96; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const f of floats) { f.y -= 60 * dt; f.life -= dt; }
  floats = floats.filter(f => f.life > 0);
  for (const s of streaks) s.y += spx * 2.2 * dt;
  streaks = streaks.filter(s => s.y < H + 120);

  if (ac && engGain) {
    const on = (state === 'play') && !muted;
    engGain.gain.setTargetAtTime(on ? .07 : 0, ac.currentTime, .1);
    engOsc.frequency.setTargetAtTime(38 + speed * .32 + (nitroT > 0 ? 25 : 0), ac.currentTime, .1);
  }
}

/* ---------- Render ---------- */
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake) * .5, rand(-shake, shake) * .5);
  // sand
  ctx.fillStyle = '#ecc98b'; ctx.fillRect(-20, -20, W + 40, H + 40);
  for (const [fx, fy, fz] of speckles) {
    const y = ((fy * (H + 40) + scroll) % (H + 40)) - 20;
    ctx.fillStyle = fz < .5 ? 'rgba(180,130,70,.25)' : 'rgba(255,240,210,.45)';
    ctx.fillRect(fx * W, y, 3 + fz * 4, 2);
  }
  // road
  ctx.fillStyle = '#4b5059'; ctx.fillRect(G.roadX - 12, -20, G.roadW + 24, H + 40);
  ctx.fillStyle = '#2a2e35'; ctx.fillRect(G.roadX, -20, G.roadW, H + 40);
  ctx.fillStyle = '#f5c518'; ctx.fillRect(G.roadX + 5, -20, 4, H + 40); ctx.fillRect(G.roadX + G.roadW - 9, -20, 4, H + 40);
  const period = G.carH * 1.15, dash = period * .5, off = scroll % period;
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  for (let i = 1; i < G.lanes; i++) {
    const x = G.roadX + G.laneW * i - 2;
    for (let y = -period + off; y < H; y += period) ctx.fillRect(x, y, 4, dash);
  }
  for (const d of decor) if (d.kind !== 'palm') drawDecor(d);
  for (const p of pickups) drawPickup(p);
  for (const c of traffic) drawTraffic(c);

  if (state !== 'menu' || true) {
    const visible = !(player.inv > 0 && Math.floor(player.inv * 12) % 2 === 0);
    const dead = state === 'over';
    if (visible) drawCaprice(ctx, player.x, player.y, G.carW, G.carH, colorHex(), save.style, { rot: player.tilt, nitro: nitroT > 0, brake: dead, alpha: dead ? .9 : 1 });
  }
  for (const d of decor) if (d.kind === 'palm') drawDecor(d);

  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2;
  ctx.beginPath(); for (const s of streaks) { ctx.moveTo(s.x, s.y); ctx.lineTo(s.x, s.y + s.len); } ctx.stroke();
  for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of floats) {
    ctx.globalAlpha = Math.max(0, f.life); ctx.font = `800 22px 'Baloo Bhaijaan 2', system-ui, sans-serif`;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,33,61,.85)'; ctx.strokeText(f.text, f.x, f.y); ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function renderPreview() {
  const cw = pv.clientWidth, ch = pv.clientHeight;
  if (!cw) return;
  const d = Math.min(window.devicePixelRatio || 1, 2.5);
  if (pv.width !== Math.round(cw * d)) { pv.width = Math.round(cw * d); pv.height = Math.round(ch * d); }
  pctx.setTransform(d, 0, 0, d, 0, 0);
  pctx.clearRect(0, 0, cw, ch);
  // speed streaks behind the car (car faces left, so streaks trail to the right)
  pctx.strokeStyle = 'rgba(255,184,28,.35)'; pctx.lineWidth = 3; pctx.lineCap = 'round';
  pctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const yy = ch * (.2 + i * .15), sx = ((t * 260 + i * 97) % (cw * .6));
    pctx.moveTo(cw * .55 + sx, yy); pctx.lineTo(cw * .55 + sx + 40, yy);
  }
  pctx.stroke();
  const L = Math.min(cw * .7, 250), Wd = L / 2.15;
  pctx.fillStyle = 'rgba(0,0,0,.25)'; pctx.beginPath(); pctx.ellipse(cw / 2 + 6, ch / 2 + 8, L * .52, Wd * .6, 0, 0, 7); pctx.fill();
  drawCaprice(pctx, cw / 2, ch / 2, Wd, L, colorHex(), save.style, { rot: -Math.PI / 2 });
}

/* ---------- HUD + garage UI ---------- */
let lastHud = '';
function renderHud(force) {
  const total = Math.floor(dist + bonus), spd = Math.round(speed);
  const key = `${total}|${runCoins}|${hearts}|${spd}|${nitroCharges}|${nitroT > 0}`;
  if (!force && key === lastHud) return; lastHud = key;
  $('#hDist').textContent = fmt(total);
  $('#hCoins').textContent = runCoins;
  $('#hSpeed').textContent = spd;
  $('#hHearts').innerHTML = [0, 1, 2].map(i => `<span class="${i < hearts ? '' : 'off'}">♥</span>`).join('');
  $('#nPips').innerHTML = [0, 1, 2].map(i => `<i class="${i < nitroCharges ? 'full' : ''}"></i>`).join('');
  const nb = $('#bNitro');
  nb.classList.toggle('empty', nitroCharges <= 0 && nitroT <= 0);
  nb.classList.toggle('on', nitroT > 0);
}

let toastTimer = 0;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2200); }

const priceHtml = (p, owned) => owned ? `<span class="price owned">عندك</span>` : `<span class="price"><span class="coin-ico"></span>${p}</span>`;
function buildGarage() {
  $('#mCoins').textContent = fmt(save.coins);
  $('#mBest').textContent = fmt(save.best);
  $('#styles').innerHTML = STYLES.map(s => {
    const owned = save.styles.includes(s.id);
    return `<button class="chip ${save.style === s.id ? 'sel' : ''}" data-style="${s.id}" id="st-${s.id}"><span>${s.name}</span>${priceHtml(s.price, owned)}</button>`;
  }).join('');
  $('#swatches').innerHTML = COLORS.map(c => {
    const owned = save.colors.includes(c.id);
    return `<button class="sw ${save.color === c.id ? 'sel' : ''} ${owned ? '' : 'locked'}" data-color="${c.id}" id="cl-${c.id}" aria-label="${c.name}"><span class="dot" style="background:${c.hex}"></span>${owned ? `<span class="price owned">${c.name}</span>` : priceHtml(c.price, false)}</button>`;
  }).join('');
  renderSoundBtn();
}
function tryBuy(list, item, label, apply) {
  if (list.includes(item.id)) { apply(); sfx.click(); return; }
  if (save.coins >= item.price) {
    save.coins -= item.price; list.push(item.id); apply(); persist(); sfx.pickup(); toast(`اشتريت ${label}!`);
  } else {
    sfx.lane(); toast(`تحتاج ${item.price - save.coins} عملة زيادة. اجمع أكثر بالسباق!`);
  }
}
$('#styles').addEventListener('click', e => {
  const b = e.target.closest('[data-style]'); if (!b) return; audioInit();
  const s = STYLES.find(x => x.id === b.dataset.style);
  tryBuy(save.styles, s, `شكل ${s.name}`, () => { save.style = s.id; persist(); });
  buildGarage();
});
$('#swatches').addEventListener('click', e => {
  const b = e.target.closest('[data-color]'); if (!b) return; audioInit();
  const c = COLORS.find(x => x.id === b.dataset.color);
  tryBuy(save.colors, c, `اللون ${c.name}`, () => { save.color = c.id; persist(); });
  buildGarage();
});
const ICON_ON = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7l-1.4-1.4a3 3 0 0 0 0-4.2zM18.5 6a8.5 8.5 0 0 1 0 12l-1.4-1.4a6.5 6.5 0 0 0 0-9.2z"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="m16 9 1.4-1.4 2.1 2.1 2.1-2.1L23 9l-2.1 2.1 2.1 2.1-1.4 1.4-2.1-2.1-2.1 2.1L16 13.2l2.1-2.1z"/></svg>';
function renderSoundBtn() { $('#bSound').innerHTML = muted ? ICON_OFF : ICON_ON; $('#bSound').setAttribute('aria-label', muted ? 'شغّل الصوت' : 'اكتم الصوت'); }
$('#bSound').addEventListener('click', () => {
  muted = !muted; try { localStorage.setItem(SAVE_KEY + '-mute', muted ? '1' : '0'); } catch (e) {}
  audioInit(); if (master) master.gain.value = muted ? 0 : .5; renderSoundBtn(); sfx.click();
});

/* ---------- Input ---------- */
const hold = (el, fn) => el.addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); fn(); el.classList.add('pressed'); setTimeout(() => el.classList.remove('pressed'), 120); });
hold($('#bLeft'), () => steer(-1));
hold($('#bRight'), () => steer(1));
hold($('#bNitro'), useNitro);
hold($('#bHorn'), () => sfx.horn());
cv.addEventListener('pointerdown', e => { audioInit(); if (state === 'play') steer(e.clientX < W / 2 ? -1 : 1); });
$('#bStart').addEventListener('click', startRun);
$('#bAgain').addEventListener('click', startRun);
$('#bGarage').addEventListener('click', goMenu);
$('#bPause').addEventListener('click', () => setPause(true));
$('#bResume').addEventListener('click', () => setPause(false));
$('#bQuit').addEventListener('click', goMenu);
window.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a') { steer(-1); e.preventDefault(); }
  else if (k === 'ArrowRight' || k === 'd') { steer(1); e.preventDefault(); }
  else if (k === ' ' || k === 'ArrowUp') { audioInit(); if (state === 'play') useNitro(); else if (state === 'menu' || state === 'over') startRun(); e.preventDefault(); }
  else if (k === 'h') sfx.horn();
  else if (k === 'p' || k === 'Escape') setPause(state === 'play');
});
document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); });
window.addEventListener('resize', resize);

/* ---------- Boot ---------- */
resize();
player.x = laneX(1);
for (let y = -G.laneW; y < H + G.laneW; y += G.carH * .8) spawnDecor(y);
buildGarage();
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); render();
  if (state === 'play') renderHud(false);
  if (state === 'menu') renderPreview();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
